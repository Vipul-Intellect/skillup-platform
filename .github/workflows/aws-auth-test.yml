name: Phase 1 - AWS Auth Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          set -e

          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: GitHub did not return an OIDC token."
            exit 1
          fi

          export OIDC_TOKEN="$TOKEN"

          python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]

          # JWT = header.payload.signature
          payload = token.split(".")[1]

          # Restore base64 padding
          payload += "=" * (-len(payload) % 4)

          decoded = base64.urlsafe_b64decode(payload)
          claims = json.loads(decoded)

          print("GitHub OIDC claims relevant to AWS:")
          print(json.dumps({
              "sub": claims.get("sub"),
              "aud": claims.get("aud"),
              "repository": claims.get("repository"),
              "repository_id": claims.get("repository_id"),
              "repository_owner": claims.get("repository_owner"),
              "repository_owner_id": claims.get("repository_owner_id"),
              "ref": claims.get("ref")
          }, indent=2))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::998631801915:role/GitHubActionsSkillUpRole
          aws-region: ap-south-1

      - name: Verify AWS authentication
        run: |
          echo "Testing AWS STS caller identity..."
          aws sts get-caller-identity